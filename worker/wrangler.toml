name = "lakeside-relay"
main = "src/index.js"
compatibility_date = "2026-09-01"

# (Production branch on Cloudflare is main; a push to main redeploys this Worker.)
# Websites allowed to open a room. Comma separated, no trailing slash, exactly as shown in the browser address bar
# (https://your-domain.example). Use * only for testing. Change this before you deploy.
[vars]
ALLOWED_ORIGINS = "https://beta.powerrmediaa.com,http://beta.powerrmediaa.com"
# Optional: MAX_SPECTATORS = "50" (spectators per room, 0 to 50) and SPECTATOR_STATE_DIVIDER = "2" (spectators get every 2nd car
# update; 1 = every update, 4 = a quarter) trade the smoothness of the live view against the free plan's request count, see README.

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

[[durable_objects.bindings]]
name = "TIMES"
class_name = "Times"

# SQLite-backed Durable Objects are the kind the free plan allows.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# v2 adds the lobby directory (live timing). Room already exists from v1, so only the new class is listed here.
[[migrations]]
tag = "v2"
new_sqlite_classes = ["Directory"]

# v3 adds the global lap times. Room and Directory already exist, so only the new class is listed here.
[[migrations]]
tag = "v3"
new_sqlite_classes = ["Times"]
