<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Lakeside</title>
<link rel="stylesheet" href="/src/style.css">
</head>
<body>
<canvas id="view"></canvas>
<div id="hud"></div>
<div id="board" hidden></div>
<div id="steer-bar" hidden><i></i></div>
<div id="touch">
  <div class="t-steer"><div class="t-hint">Drag to steer</div><div class="t-knob"></div></div>
  <div class="t-pedals">
    <button data-pedal="drs" class="t-drs">DRS</button>
    <button data-pedal="brake" class="t-brake">Brake</button>
    <button data-pedal="throttle" class="t-gas">Throttle</button>
  </div>
</div>
<div class="t-top">
  <button data-action="reset" aria-label="Back on track">Reset</button>
  <button data-action="camera" aria-label="Switch camera">Camera</button>
  <button data-action="board" class="t-times" aria-label="Lap times">Times</button>
  <button data-action="report" aria-label="Report a problem">Report</button>
  <button data-action="settings" aria-label="Settings">Settings</button>
</div>
<div id="report-layer" hidden>
  <header class="report-head">
    <strong>Track report</strong>
    <div><button id="report-center" type="button">Center</button><button id="report-follow" type="button">Follow</button><button id="report-resume" type="button">Resume</button></div>
  </header>
  <nav class="report-tools">
    <button data-report-tool="pick" class="selected" type="button">Pick</button>
    <button data-report-tool="box" type="button">Box select</button>
    <button id="report-clear" type="button">Clear</button>
    <output id="report-coordinate">Move over the map</output>
  </nav>
  <section class="report-details">
    <div id="report-selection">No features selected</div>
    <label for="report-category">Category</label>
    <select id="report-category">
      <option>barrier on track</option><option>empty space</option><option>floating</option><option>collision</option><option>other</option>
    </select>
    <label for="report-note">Note</label>
    <textarea id="report-note" rows="3" maxlength="2000"></textarea>
    <button id="report-save" type="button">Save report</button>
    <span id="report-status" role="status"></span>
    <span id="report-pending">0 unsent</span>
  </section>
  <div id="report-rect" hidden></div>
</div>
<div id="settings" hidden>
  <div class="box">
    <h2>Settings</h2>
    <label>Speed</label>
    <div class="row"><button data-units="mph">mph</button><button data-units="kmh">km/h</button></div>
    <label>Traction control</label>
    <div class="row"><button data-assist="tc" data-on="true">On</button><button data-assist="tc" data-on="false">Off</button></div>
    <label>ABS</label>
    <div class="row"><button data-assist="abs" data-on="true">On</button><button data-assist="abs" data-on="false">Off</button></div>
    <label>Stability control</label>
    <div class="row"><button data-assist="esc" data-on="true">On</button><button data-assist="esc" data-on="false">Off</button></div>
    <label>Steering</label>
    <div class="row"><button data-steering="keyboard">Keyboard</button><button data-steering="cursor">Cursor</button></div>
    <label for="steersens">Cursor sensitivity</label>
    <input id="steersens" type="range" min="50" max="200" step="5" value="100">
    <label>View</label>
    <div class="row"><button data-topdown="false">Driving</button><button data-topdown="true">Top-down debug</button></div>
        <label>Detail</label>
    <div class="row"><button data-blockout="false">Full</button><button data-blockout="true">Blockout</button></div>
        <label>Handling readout</label>
    <div class="row"><button data-debug="false">Hide</button><button data-debug="true">Show</button></div>
    <label>Sound</label>
    <div class="row"><button data-sound="true">On</button><button data-sound="false">Off</button></div>
    <label for="volume">Volume</label>
    <input id="volume" type="range" min="0" max="100" step="1" value="70">
    <label>Autopilot demo lap</label>
    <div class="row"><button data-auto="false">Off</button><button data-auto="true">On</button></div>
    <label>Multiplayer (optional)</label>
    <div class="mp">
      <input id="mp-name" type="text" maxlength="16" placeholder="Your name" aria-label="Your name" autocomplete="off" spellcheck="false">
      <div class="row" id="mp-start"><button id="mp-host" type="button">Host a room</button></div>
      <div class="row" id="mp-joinrow"><input id="mp-code" type="text" maxlength="5" placeholder="Room code" aria-label="Room code" autocomplete="off" autocapitalize="characters" spellcheck="false"><button id="mp-join" type="button">Join</button></div>
      <div id="mp-room" hidden>
        <div class="mp-big" id="mp-big" aria-label="Room code"></div>
        <div class="row"><button id="mp-copy" type="button">Copy code</button><button id="mp-leave" type="button">Leave</button></div>
        <p class="mp-status" id="mp-hint" hidden>Keep this tab in the foreground while friends join. Browsers slow down background tabs.</p>
      </div>
      <p class="mp-status" id="mp-status" role="status">Race other people online. Needs a real web host, not the claude.ai preview.</p>
      <p class="mp-status" id="mp-who"></p>
      <details class="mp-details" id="mp-details" hidden><summary>Connection details</summary><p class="mp-status" id="mp-diag"></p></details>
    </div>
    <button id="close" class="main">Back to driving</button>
  </div>
</div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
